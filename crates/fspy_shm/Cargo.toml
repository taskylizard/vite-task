[package]
name = "fspy_shm"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[target.'cfg(not(any(target_os = "linux", target_os = "windows")))'.dependencies]
shared_memory = { workspace = true, features = ["logging"] }

[target.'cfg(target_os = "linux")'.dependencies]
base64 = { workspace = true }
memmap2 = { workspace = true }
rustix = { workspace = true, features = ["fs", "net"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
base64 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
] }

[dev-dependencies]
ctor = { workspace = true }
subprocess_test = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[lib]
doctest = false

[package.metadata.cargo-shear]
ignored = ["ctor"]
